<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion & Inscription | Zynetik Web</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3.5rem 2rem 2rem 2rem;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0,210,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-family: var(--font-heading);
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i,
        .input-wrapper svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 3rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(0,210,255,0.05);
            box-shadow: 0 0 15px rgba(0,210,255,0.1);
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255,255,255,0.03);
            padding: 0.4rem;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .auth-tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 10px;
            transition: var(--transition-smooth);
        }

        .auth-tab.active {
            background: rgba(0,210,255,0.1);
            color: var(--accent-primary);
            box-shadow: 0 2px 10px rgba(0,210,255,0.1);
        }

        .btn-auth {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-bounce);
            margin-top: 1rem;
        }

        .btn-auth:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,210,255,0.3);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .back-home {
            position: absolute;
            top: 5rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            transition: var(--transition-smooth);
            z-index: 100;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .back-home:hover {
            color: var(--accent-primary);
            transform: translateX(-5px);
        }

        #register-form { display: none; }
    </style>
</head>
<body>
    <div class="promo-banner">
        <span class="promo-dot"></span>
        <span class="promo-text">- 10% sur votre première commande avec le code <span class="promo-code">BIENVENUE2026</span></span>
    </div>


        <a href="index.html" class="back-home"><i data-lucide="arrow-left"></i> <span data-i18n="back_home">Retour à l'accueil</span></a>

    <div class="auth-container">
        <div class="auth-card reveal">
            <div class="auth-header">
                <h1 id="auth-title" data-i18n="auth_login_title">Connexion</h1>
                <p id="auth-subtitle" data-i18n="auth_login_subtitle">Accédez à votre espace Zynetik Web</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuth('login')">Connexion</div>
                <div class="auth-tab" onclick="switchAuth('register')">Inscription</div>
            </div>

            <!-- Login Form -->
            <form id="login-form" action="register_handler.php" method="POST">
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label data-i18n="email_prof">Email professionnel</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" name="email" placeholder="nom@entreprise.com" data-i18n="email_prof" required>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="password">Mot de passe</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" name="password" placeholder="••••••••" data-i18n="password" required>
                    </div>
                </div>
                <div style="text-align: right; margin-bottom: 1.5rem;">
                    <a href="#" style="font-size: 0.8rem; color: var(--accent-primary);">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn-auth">Se connecter</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" action="register_handler.php" method="POST">
                <input type="hidden" name="action" value="register">
                <div class="form-group">
                    <label>Nom complet</label>
                    <div class="input-wrapper">
                        <i data-lucide="user"></i>
                        <input type="text" name="fullName" placeholder="Jean Dupont" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email professionnel</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" name="email" placeholder="nom@entreprise.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-auth">Créer mon compte</button>
            </form>

            <div class="auth-footer">
                <p>Besoin d'aide ? <a href="contact.html">Contactez le support</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
        
        function switchAuth(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const tabs = document.querySelectorAll('.auth-tab');

            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                title.innerText = 'Connexion';
                subtitle.innerText = 'Accédez à votre espace Zynetik Web';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                title.innerText = 'Inscription';
                subtitle.innerText = 'Rejoignez l\'infrastructure haute performance';
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        // Gestion de la soumission via AJAX
        const forms = ['login-form', 'register-form'];
        forms.forEach(formId => {
            document.getElementById(formId).addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = this.querySelector('button');
                const originalText = btn.innerText;
                btn.innerText = 'Traitement...';
                btn.disabled = true;

                // Si on est en file://, on simule car le PHP ne peut pas s'exécuter
                if (window.location.protocol === 'file:') {
                    showToast("Mode Démo : Redirection vers le dashboard simulée...", "info");
                    setTimeout(() => {
                        window.location.href = 'dashboard/index.php';
                    }, 2000);
                    return;
                }

                // Envoi réel si sur serveur
                const formData = new FormData(this);
                fetch('register_handler.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.redirected) {
                        window.location.href = response.url;
                    } else {
                        return response.text();
                    }
                })
                .then(text => {
                    if (text) {
                        showToast(text, 'error'); // Affiche l'erreur du PHP
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    btn.innerText = originalText;
                    btn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
